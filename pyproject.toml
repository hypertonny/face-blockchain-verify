[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-blockchain-verify"
version = "1.0.0"
description = "Face encoding, live reverse-image search, same-face verification, and tamper-evident blockchain records"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hypertonny"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "opencv-python-headless==5.0.0.93",
  "numpy==2.5.2",
  "requests==2.34.2",
  "insightface==1.0.1",
  "onnxruntime==1.29.0",
  "base58==2.1.1",
  "PyNaCl==1.6.2",
  "stellar-sdk==16.1.0",
  "web3==8.0.0",
  "py-solc-x==2.0.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "eth-tester==0.14.0b1", "py-evm==0.12.1b1"]

[project.scripts]
fbv = "fbv:main"

[tool.setuptools]
py-modules = [
  "fbv", "pipeline", "verify", "bench", "deploy_polygon", "face",
  "reverse_search", "match_verify", "blockchain", "stellar", "polygon",
  "cliutil", "ui",
]
